[project]
name = "llm-usability-backend"
version = "0.1.0"
description = "LLM API provider availability monitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "loguru>=0.7",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() in default is idiomatic
    "UP042", # str-Enum hybrid is fine for our use
    # Many docstrings and comments use CJK punctuation (— vs -, × vs x,
    # full-width digits). These are intentional editorial choices, not
    # bugs. The ambiguity flag is meant for code identifiers, not prose.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Alembic auto-generates migration templates with the typing.Union /
# typing.Sequence form (it's what the template renderer emits). Rewriting
# these per migration buys nothing — they're a stable artifact, not
# evolving code — and changing the templates is fragile. Suppress the
# pep604/deprecated-import / import-order nits inside the versions dir
# so `ruff check` is meaningful for app code.
"alembic/versions/*" = ["UP007", "UP035", "I001", "E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
