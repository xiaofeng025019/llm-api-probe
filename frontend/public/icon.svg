<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sweepGrad" x1="256" y1="256" x2="429" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="96" stroke="#99f6e4" stroke-width="4" fill="none"/>

  <!-- Outer radar ring -->
  <circle cx="256" cy="256" r="200" stroke="#5eead4" stroke-width="8" fill="none"/>
  <!-- Middle radar ring -->
  <circle cx="256" cy="256" r="140" stroke="#2dd4bf" stroke-width="6" fill="none"/>
  <!-- Inner radar ring -->
  <circle cx="256" cy="256" r="80" stroke="#14b8a6" stroke-width="4" fill="none"/>

  <!-- Radar sweep -->
  <path d="M256 256 L256 56 A200 200 0 0 1 429.4 156 Z" fill="url(#sweepGrad)" opacity="0.5"/>

  <!-- Probe pulse line -->
  <polyline
    points="80,290 150,290 170,290 185,230 200,330 215,260 230,290 280,290 300,290 315,250 330,320 345,270 360,290 432,290"
    stroke="url(#pulseGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="#10b981"/>
  <circle cx="256" cy="256" r="22" stroke="#10b981" stroke-width="2" fill="none" opacity="0.5"/>
  <circle cx="256" cy="256" r="30" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Nodes -->
  <circle cx="256" cy="56" r="10" fill="#06b6d4"/>
  <circle cx="429" cy="156" r="10" fill="#8b5cf6"/>
  <circle cx="429" cy="356" r="10" fill="#f59e0b"/>
  <circle cx="256" cy="456" r="10" fill="#10b981"/>
  <circle cx="83" cy="356" r="10" fill="#f59e0b"/>
  <circle cx="83" cy="156" r="10" fill="#8b5cf6"/>

  <!-- Connection lines -->
  <line x1="256" y1="256" x2="256" y2="56" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <line x1="256" y1="256" x2="429" y2="156" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3"/>
  <line x1="256" y1="256" x2="256" y2="456" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>

  <!-- Text -->
  <text x="256" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="6" fill="#0f766e">API</text>
  <text x="256" y="436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="8" fill="#14b8a6">PROBE</text>
</svg>
