name: llm-api-probe

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: llm-api-probe:latest
    container_name: llm-api-probe
    restart: unless-stopped
    ports:
      - "127.0.0.1:6200:6200"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "6200"
      DATABASE_URL: sqlite+aiosqlite:////app/data/llm_api_probe.db
      SYNC_DATABASE_URL: sqlite:////app/data/llm_api_probe.db
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:6200/api/v1/healthz',timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
